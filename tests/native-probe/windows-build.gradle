// Optional Windows build-only workaround for older Ninja's MAX_PATH limit.
// Example: -I tests/native-probe/windows-build.gradle -Droadguard.native.cxxRoot=D:/rg-cxx-20261124
// No dependency changes/cache deletion. Default application behavior is unchanged;
// the separate opt-in loopbackQa property adds only the sandbox network overlay.
gradle.beforeProject { project ->
  project.afterEvaluate {
    if (project.plugins.hasPlugin('com.android.application') && System.getProperty('roadguard.native.storageQa') == 'true') {
      project.extensions.getByName('react').entryFile = new File(project.rootDir.parentFile, 'tests/native-probe/storage-entry.tsx')
    }
  }
  project.plugins.withId('com.android.application') {
    // Opt-in standalone sandbox QA only. Default release remains unchanged.
    // HTTP defaults to loopback. A single explicit private IPv4 storage host
    // may be opted into for real sandbox-presigned URLs; never global cleartext.
    if (System.getProperty('roadguard.native.loopbackQa') == 'true') {
      def qaRoot = new File(project.rootDir.parentFile, 'tests/native-probe/loopback-qa')
      project.android.sourceSets.release.manifest.srcFile(new File(qaRoot, 'AndroidManifest.xml'))
      def storageHost = System.getProperty('roadguard.native.storageQaHost')
      if (storageHost != null) {
        def octets = storageHost.split('\\.', -1)
        def valid = octets.length == 4 && octets.every { it ==~ /0|[1-9][0-9]{0,2}/ } && octets.every { it.toInteger() <= 255 }
        def privateAddress = valid && (octets[0] == '10' || (octets[0] == '172' && octets[1].toInteger() in 16..31) || (octets[0] == '192' && octets[1] == '168'))
        if (!privateAddress) throw new GradleException('storageQaHost must be one explicit private IPv4 address')
        def generated = new File(project.buildDir, 'generated/roadguard-sandbox-network')
        def resource = new File(generated, 'xml/roadguard_loopback_qa.xml')
        resource.parentFile.mkdirs()
        resource.text = new File(qaRoot, 'res/xml/roadguard_loopback_qa.xml').text.replace('</domain-config>', '<domain includeSubdomains="false">' + storageHost + '</domain></domain-config>')
        project.android.sourceSets.release.res.srcDir(generated)
      } else {
        project.android.sourceSets.release.res.srcDir(new File(qaRoot, 'res'))
      }
    }
    project.android.defaultConfig.externalNativeBuild.cmake.arguments.add('-DCMAKE_OBJECT_PATH_MAX=250')
    def staging = System.getProperty('roadguard.native.cxxRoot')
    if (staging != null) {
      project.android.externalNativeBuild.cmake.buildStagingDirectory = new File(staging)
    }
  }
  // Release compiles separate C++ variants for these libraries. Their default
  // node_modules staging paths also exceed Windows/Ninja limits.
  project.plugins.withId('com.android.library') {
    if (project.name in ['react-native-reanimated', 'react-native-worklets']) {
      project.android.defaultConfig.externalNativeBuild.cmake.arguments.add('-DCMAKE_OBJECT_PATH_MAX=250')
      def staging = System.getProperty('roadguard.native.cxxRoot')
      if (staging != null) {
        project.android.externalNativeBuild.cmake.buildStagingDirectory = new File(staging, project.name)
      }
    }
  }
}
