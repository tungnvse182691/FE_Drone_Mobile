      additionalProperties: false
      properties:
        id: *id004
        ownerId: *id004
        caseId: *id004
        receivedAt: *id011
        status:
          type: string
          enum:
          - RECEIVED
          - IN_REVIEW
          - PUBLISHED
        version: *id013
      required:
      - id
      - ownerId
      - caseId
      - receivedAt
      - status
      - version
      description: Projection của Reporter không trả owner người khác hoặc internal case.
    PublicEvent:
      type: object
      additionalProperties: false
      properties:
        id: *id004
        occurredAt: *id011
        message: *id012
        publishedFileIds:
          type: array
          items: *id004
