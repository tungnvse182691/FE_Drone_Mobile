components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token; server vẫn kiểm current account/membership/ownership/assignment.
    serviceBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Service audience riêng, ràng job/attempt, không dùng user token.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
      description: Opaque random key, scoped actor+operation+resource; stable payload hash; không dùng key như quyền.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        minLength: 3
      description: Strong quoted ETag đã nhận của aggregate bị đổi; không chấp nhận wildcard *. 428 thiếu; 412 stale.
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: Opaque cursor bound to scope/filter/as-of.
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      description: Giới hạn contract đề xuất, không phải mức tải đã benchmark.
  schemas:
    ErrorDetail:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
        code: *id012
        message: *id012
      required:
      - code
      - message
    Error:
      type: object
      additionalProperties: false
      properties:
        code: *id012
        message: *id012
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
        traceId: *id012
        retryable: &id014
          type: boolean
      required:
      - code
      - message
      - details
      - traceId
      - retryable
      description: Không chứa stacktrace, PII, secrets hoặc giá trị password/token.
    Ack:
      type: object
      additionalProperties: false
      properties:
        id: *id004
        status:
          type: string
          enum:
          - ACCEPTED
        version: &id013
          type: string
          minLength: 1
          description: Opaque concurrency version; không parse thành số ở client.
      required:
      - id
      - status
      - version
    Point:
      type: object
      additionalProperties: false
      properties:
        longitude:
          type: number
          minimum: -180
          maximum: 180
        latitude:
          type: number
          minimum: -90
          maximum: 90
      required:
      - longitude
      - latitude
      description: WGS84; tên thuộc tính tránh đảo lat/lon; GeoJSON position array bên dưới là lon,lat.
    Position:
      type: object
      additionalProperties: false
      properties:
        point:
          $ref: '#/components/schemas/Point'
        source:
          type: string
          enum:
          - EXIF
          - MANUAL
          - SURVEY
          - DERIVED
        accuracyMeters:
          anyOf:
          - type: number
            minimum: 0
          - type: 'null'
        capturedAt:
          anyOf:
          - *id011
          - type: 'null'
      required:
      - point
      - source
    Actor:
      type: object
      additionalProperties: false
      properties:
        id: *id004
        displayName: *id012
        role:
          type: string
          enum:
          - SUPERVISOR
          - PM
          - OPERATOR
          - CREW
          - REPORTER
        version: *id013
      required:
      - id
      - displayName
      - role
      - version
    LoginRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
      required:
      - email
      - password
    TokenPair:
      type: object
      additionalProperties: false
      properties:
        accessToken: *id012
        refreshToken: *id012
        tokenType:
          type: string
          enum:
          - Bearer
        expiresIn:
          type: integer
          minimum: 1
        mustChangePassword: *id014
        user:
          $ref: '#/components/schemas/Actor'
      required:
      - accessToken
      - refreshToken
      - tokenType
      - expiresIn
      - mustChangePassword
      - user
    RefreshRequest:
      type: object
      additionalProperties: false
      properties:
        refreshToken: *id012
      required:
      - refreshToken
    RegisterReporter:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          description: Email hợp lệ; không giới hạn nhà cung cấp email.
        password: *id012
        displayName: *id012
        reporterType: *id012
      required:
      - email
      - password
      - displayName
      - reporterType
      description: reporterType phải thuộc danh mục ReporterType đã đối chiếu DD; không mở role input.
    RegistrationIntent:
      type: object
      additionalProperties: false
      properties:
        intentId: *id004
        status:
          type: string
          enum:
          - PENDING_VERIFICATION
        resendAfterSeconds: &id017
          type: integer
          minimum: 0
      required:
      - intentId
      - status
      - resendAfterSeconds
      description: Cùng shape cho địa chỉ tồn tại, không lộ account; intent opaque không cấp business access.
    VerifyOtp:
      type: object
      additionalProperties: false
      properties:
        intentId: *id004
        otp: *id012
      required:
      - intentId
      - otp
    ResendOtp:
      type: object
      additionalProperties: false
      properties:
        intentId: *id004
      required:
      - intentId
    ChangePassword:
      type: object
      additionalProperties: false
      properties:
        currentPassword: *id012
        newPassword: *id012
      required:
      - currentPassword
      - newPassword
    ResetPassword:
      type: object
      additionalProperties: false
      properties:
        temporaryPassword: *id012
        reason: *id012
      required:
      - temporaryPassword
      - reason
      description: Supervisor thực hiện; truyền TLS, không echo/log password. Buộc đổi ở lần login tiếp theo.
    ForgotPassword:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
      required:
      - email
      description: Tạo yêu cầu khôi phục, không tự reset; luôn trả 202 trung tính.
    InvitationRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum:
          - PM
          - OPERATOR
          - CREW
          - SUPERVISOR
        projectIds:
          type: array
          items: *id004
          uniqueItems: true
      required:
      - email
      - role
      - projectIds
    Invitation:
      type: object
      additionalProperties: false
      properties:
        id: *id004
        status:
          type: string
          enum:
          - PENDING
          - ACCEPTED
          - EXPIRED
          - REVOKED
        expiresAt: *id011
        version: *id013
      required:
      - id
      - status
      - expiresAt
      - version
    AcceptInvitation:
      type: object
      additionalProperties: false
      properties:
        invitationToken: *id012
