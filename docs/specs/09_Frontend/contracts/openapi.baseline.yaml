openapi: 3.1.1
info:
  title: RoadGuard — Proposed API Contract R3
  version: 0.2.0-draft-alignment
  description: Thiết kế canonical sau alignment 28/09/2026. Business decisions đã chốt được phản ánh với trạng thái riêng; wire contract vẫn draft/proposed và chưa triển khai runtime. Xem decision register, Auth/Sequence/Error trước codegen. API wire enums không thay số enum database.
x-contract-status: PROPOSED_DELTA
x-business-decision-source: planning/V2/V2-3_DECISION_REGISTER.md
x-runtime-status: NOT_ENABLED
servers:
- url: /api/v1
