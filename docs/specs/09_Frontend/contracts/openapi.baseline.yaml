      required:
      - id
      - routeVersionId
      - status
      - segments
      - version
    BranchRequest:
      type: object
      additionalProperties: false
      properties:
        code: *id012
        routeVersionId: *id004
        startNodeId:
          anyOf:
          - *id004
          - type: 'null'
        endNodeId:
          anyOf:
          - *id004
          - type: 'null'
        connectionReason: *id012
      required:
      - code
      - routeVersionId
      - connectionReason
    Branch:
      type: object
      additionalProperties: false
      properties:
        id: *id004
        projectId: *id004
        code: *id012
        routeVersionId: *id004
        version: *id013
      required:
      - id
      - projectId
      - code
      - routeVersionId
      - version
    SlabRequest:
      type: object
      additionalProperties: false
      properties:
        routeVersionId: *id004
        laneCode: *id012
        startMeters: *id016
        endMeters: *id016
        status:
          type: string
          enum:
          - PROVISIONAL
          - CONFIRMED
        sourceFileIds:
          type: array
          items: *id004
      required:
      - routeVersionId
      - laneCode
      - startMeters
      - endMeters
      - status
      - sourceFileIds
