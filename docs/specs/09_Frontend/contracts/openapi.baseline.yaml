    Slab:
      type: object
      additionalProperties: false
      properties:
        id: *id004
        projectId: *id004
        routeVersionId: *id004
        laneCode: *id012
        startMeters: *id016
        endMeters: *id016
        status:
          type: string
          enum:
          - PROVISIONAL
          - CONFIRMED
        version: *id013
      required:
      - id
      - projectId
      - routeVersionId
      - laneCode
      - startMeters
      - endMeters
      - status
      - version
    ReportPhoto:
      type: object
      additionalProperties: false
      properties:
        fileId: *id004
        position:
          $ref: '#/components/schemas/Position'
      required:
      - fileId
      description: Thiếu EXIF không dùng GPS upload; có thể lưu thiếu vị trí chờ điều phối với nhãn thiếu.
    ReportCreate:
      type: object
      additionalProperties: false
      properties:
        description: *id012
        photos:
          type: array
          items:
            $ref: '#/components/schemas/ReportPhoto'
          minItems: 1
