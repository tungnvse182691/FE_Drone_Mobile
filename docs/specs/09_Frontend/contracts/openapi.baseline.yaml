        password: *id012
      required:
      - invitationToken
      - displayName
      - password
    ProfileUpdate:
      type: object
      additionalProperties: false
      properties:
        displayName: *id012
      required:
      - displayName
    AccountUpdate:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
          - ACTIVE
          - SUSPENDED
        role:
          type: string
          enum:
          - SUPERVISOR
          - PM
          - OPERATOR
          - CREW
          - REPORTER
        reason: *id012
      required:
      - status
      - role
      - reason
    MembershipRequest:
      type: object
      additionalProperties: false
      properties:
        userId: *id004
        role:
          type: string
          enum:
          - PM
          - OPERATOR
          - CREW
        active: *id014
        validFrom: *id011
        validTo:
          anyOf:
          - *id011
          - type: 'null'
        reason: *id012
      required:
      - userId
      - role
      - active
      - validFrom
      - reason
    Membership:
      type: object
      additionalProperties: false
      properties:
        id: *id004
        projectId: *id004
        userId: *id004
        role: *id012
        active: *id014
        version: *id013
      required:
      - id
      - projectId
      - userId
      - role
      - active
      - version
    ProjectCreate:
      type: object
      additionalProperties: false
      properties:
        code: *id012
        name: *id012
        primaryPmId: *id004
        handoverDate:
          type: string
          format: date
        warrantyEndDate:
          type: string
          format: date
        handoverFileIds:
          type: array
          items: *id004
      required:
      - code
      - name
      - primaryPmId
      - handoverDate
      - warrantyEndDate
      - handoverFileIds
      description: Supervisor tạo; warrantyEndDate>=handoverDate; chỉ định đúng một PM chính.
    Project:
      type: object
      additionalProperties: false
      properties:
        id: *id004
        code: *id012
        name: *id012
        primaryPmId: *id004
        handoverDate:
          type: string
          format: date
        warrantyEndDate:
          type: string
          format: date
        status:
          type: string
          enum:
          - ACTIVE
          - CLOSED
        version: *id013
      required:
      - id
      - code
      - name
      - primaryPmId
      - handoverDate
      - warrantyEndDate
      - status
      - version
    ProjectUpdate:
      type: object
      additionalProperties: false
      properties:
        name: *id012
        primaryPmId: *id004
        warrantyEndDate:
          type: string
          format: date
        reason: *id012
      required:
      - name
      - primaryPmId
      - warrantyEndDate
      - reason
    Reason:
      type: object
      additionalProperties: false
      properties:
        reason: *id012
      required:
      - reason
    WidthInterval:
      type: object
      additionalProperties: false
      properties:
        startMeters:
          type: number
          minimum: 0
        endMeters: &id015
          type: number
          exclusiveMinimum: 0
        roadWidthMeters: *id015
      required:
      - startMeters
      - endMeters
      - roadWidthMeters
    GeoJsonLine:
      type: object
      additionalProperties: false
      required:
      - type
      - coordinates
      properties:
        type:
          type: string
          enum:
          - LineString
        coordinates:
          type: array
          items:
            type: array
            prefixItems:
            - type: number
              minimum: -180
              maximum: 180
            - type: number
              minimum: -90
              maximum: 90
            items: false
            minItems: 2
            maxItems: 2
          minItems: 2
    RouteDraftRequest:
      type: object
      additionalProperties: false
      properties:
        sourceFileId: *id004
        trackId: *id012
        sourceCrs: *id012
        metricCrs: *id012
        centerline:
          $ref: '#/components/schemas/GeoJsonLine'
        stationOriginMeters: &id016
          type: number
        widthIntervals:
          type: array
          items:
            $ref: '#/components/schemas/WidthInterval'
          minItems: 1
        surveyTotalWidthMeters: *id015
      required:
      - sourceCrs
      - metricCrs
      - stationOriginMeters
      - widthIntervals
      - surveyTotalWidthMeters
      description: Cần sourceFileId hoặc centerline; sourceFileId GPX nhiều track cần trackId; centerline luôn WGS84, sourceCrs
        mô tả bản gốc. Backend chuyển metricCrs đã kiểm chứng. Không lấy tổng corridor làm road width.
      anyOf:
      - required:
        - sourceFileId
      - required:
        - centerline
    RouteVersion:
      type: object
      additionalProperties: false
      properties:
        id: *id004
        projectId: *id004
        status:
          type: string
          enum:
          - DRAFT
          - CONFIRMED
        centerline:
          $ref: '#/components/schemas/GeoJsonLine'
        metricCrs: *id012
        widthIntervals:
          type: array
          items:
            $ref: '#/components/schemas/WidthInterval'
        surveyTotalWidthMeters: *id015
        sourceFileId:
          anyOf:
          - *id004
          - type: 'null'
        version: *id013
      required:
      - id
      - projectId
      - status
      - centerline
      - metricCrs
      - widthIntervals
      - surveyTotalWidthMeters
      - sourceFileId
      - version
    SegmentRequest:
      type: object
      additionalProperties: false
      properties:
        routeVersionId: *id004
        targetLengthMeters: *id015
        boundariesMeters:
          type: array
          items:
            type: number
            minimum: 0
      required:
      - routeVersionId
      description: Đúng một trong targetLengthMeters hoặc boundariesMeters; boundary tăng, phủ tuyến không hở/chồng.
      oneOf:
      - required:
        - targetLengthMeters
        not:
          required:
          - boundariesMeters
      - required:
        - boundariesMeters
        not:
          required:
          - targetLengthMeters
    Segment:
      type: object
      additionalProperties: false
      properties:
        id: *id004
        startMeters: *id016
        endMeters: *id016
      required:
      - id
      - startMeters
      - endMeters
    SegmentSet:
      type: object
      additionalProperties: false
